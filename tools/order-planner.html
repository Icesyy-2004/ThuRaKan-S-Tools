const SID='12BwebMg-5KW2HDhd_OQNBlvItVrvX9oF86i0LnZ0WzI';let raw=[],catalog=[],orders=[],items=[],tab='stock';const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('th-TH'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s??'').toLowerCase().replace(/[\s._\-\/()]/g,''),nameNorm=s=>norm(s).replace(/^(แลกซื้อ|เทเล|แถม)+/g,'').replace(/(อัพ|สีแดง|สีดำ)+$/g,'');const code=s=>norm(s).toUpperCase(),core=s=>{const m=String(s??'').toUpperCase().match(/(?:[A-Z]{1,5})?\s*(\d{2,})(?:\s*T\.?\s*(\d+)|\s*(RT))?/);return m?m[1]+(m[2]?'T'+m[2]:(m[3]?'RT':'')):''};function matrix(ws){const ks=Object.keys(ws).filter(k=>k[0]!=='!');let r=0,c=0;ks.forEach(k=>{const p=XLSX.utils.decode_cell(k);r=Math.max(r,p.r);c=Math.max(c,p.c)});ws['!ref']=XLSX.utils.encode_range({r:0,c:0},{r,c});return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true})}function hi(h,n){n=n.map(norm);let i=h.findIndex(x=>n.includes(norm(x)));return i<0?h.findIndex(x=>n.some(y=>norm(x).includes(y))):i}function date(v){if(v instanceof Date)return v;if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?new Date(d.y,d.m-1,d.d):null}const d=new Date(v);return isNaN(d)?null:d}function dlabel(d){return d?d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'-'}

function saved(){try{return JSON.parse(localStorage.getItem('orderPlannerStock')||'{}')}catch{return{}}}function renderStock(){const s=saved();$('#main').innerHTML=`<div class="metrics"><div class="metric"><span>ออเดอร์</span><b>${fmt(orders.length)}</b></div><div class="metric"><span>ออเดอร์อัพ</span><b>${fmt(orders.filter(x=>x.up).length)}</b></div><div class="metric"><span>ชนิดสินค้า</span><b>${fmt(items.length)}</b></div><div class="metric"><span>รอคำนวณ</span><b>—</b></div></div><div class="tabs"><button class="tab on">กรอกสต๊อก</button></div><div class="tools"><button id="zero">ล้างจำนวน</button><small>ค่าจะจำไว้ในเบราว์เซอร์เครื่องนี้</small></div><div class="table"><table class="stock"><thead><tr><th>สินค้า</th><th>ยอดที่ต้องใช้</th><th>สต๊อกปัจจุบัน</th><th>ของเข้าเพิ่ม</th><th>รวมพร้อมใช้</th></tr></thead><tbody>${items.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${fmt(x.needed)}</td><td><input data-name="${esc(x.name)}" data-k="now" type="number" min="0" value="${s[x.name]?.now||0}"></td><td><input data-name="${esc(x.name)}" data-k="incoming" type="number" min="0" value="${s[x.name]?.incoming||0}"></td><td data-total="${esc(x.name)}">${fmt((s[x.name]?.now||0)+(s[x.name]?.incoming||0))}</td></tr>`).join('')}</tbody></table></div>`;document.querySelectorAll('input[data-name]').forEach(i=>i.oninput=()=>{const o=saved(),n=i.dataset.name;o[n]=o[n]||{};o[n][i.dataset.k]=+i.value||0;localStorage.setItem('orderPlannerStock',JSON.stringify(o));const z=o[n];document.querySelector(`[data-total="${CSS.escape(n)}"]`).textContent=fmt((z.now||0)+(z.incoming||0))});$('#zero').onclick=()=>{localStorage.removeItem('orderPlannerStock');renderStock()}}
function calculate(){if(!orders.length)return alert('เตรียมตารางสต๊อกก่อน');const s=saved(),inv=new Map(items.map(x=>[x.name,(s[x.name]?.now||0)+(s[x.name]?.incoming||0)]));orders.forEach(o=>{o.block=[];o.need.forEach((q,n)=>{if((inv.get(n)||0)<q)o.block.push(n)});o.packed=!o.block.length;if(o.packed)o.need.forEach((q,n)=>inv.set(n,(inv.get(n)||0)-q));});const sum=new Map;orders.forEach(o=>{if(!sum.has(o.main))sum.set(o.main,{name:o.main,total:0,up:0,packed:0,blocked:0,last:null,reasons:new Map});const x=sum.get(o.main);x.total++;x.up+=o.up?1:0;if(o.packed){x.packed++;if(!o.up&&o.date&&(!x.last||o.date>x.last))x.last=o.date}else{x.blocked++;o.block.forEach(n=>x.reasons.set(n,(x.reasons.get(n)||0)+1))}});const rows=[...sum.values()].sort((a,b)=>b.total-a.total);const blocks=new Map;orders.filter(o=>!o.packed).forEach(o=>o.block.forEach(n=>blocks.set(n,(blocks.get(n)||0)+1)));$('#main').innerHTML=`<div class="metrics"><div class="metric"><span>ออเดอร์ทั้งหมด</span><b>${fmt(orders.length)}</b></div><div class="metric"><span>แพ็คได้</span><b class="ok">${fmt(orders.filter(x=>x.packed).length)}</b></div><div class="metric"><span>ยังแพ็คไม่ได้</span><b class="bad">${fmt(orders.filter(x=>!x.packed).length)}</b></div><div class="metric"><span>สินค้าเป็นตัวขวาง</span><b>${fmt(blocks.size)}</b></div></div><div class="tabs"><button class="tab on">ผลตามสินค้าหลัก</button><button class="tab" id="backStock">แก้สต๊อก</button></div><div class="table"><table><thead><tr><th>สินค้าหลัก</th><th>ทั้งหมด</th><th>อัพ</th><th>แพ็คได้</th><th>ค้าง</th><th>ธรรมดาแพ็คถึงวันที่</th><th>ติดสินค้า</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${fmt(x.total)}</td><td>${fmt(x.up)}</td><td class="ok">${fmt(x.packed)}</td><td class="bad">${fmt(x.blocked)}</td><td>${dlabel(x.last)}</td><td>${esc([...x.reasons].sort((a,b)=>b[1]-a[1]).map(([n,c])=>`${n} (${c})`).join(', ')||'-')}</td></tr>`).join('')}</tbody></table></div><div class="tools" style="margin-top:10px"><b>ตัวข function unavailable(){try{return new Set(JSON.parse(localStorage.getItem('orderPlannerUnavailable')||'[]'))}catch{return new Set}}
